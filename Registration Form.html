<!DOCTYPE html>
<html>
    <head>
        <title>Seminar Registration Form</title>
    </head>
    <body>
        <h2>Seminar Registration Form</h2>
        <form action="submit_form.php" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>
            
            <label for="email">Email:</label>
            <input type="text" id="email" name="email"><br><br>
            
            <label for="college">College Name:</label>
            <input type="text" id="college" name="college"><br><br>
            
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>
            
            <label>Select Seminar Topic(s):</label><br>
            <input type="checkbox" id="topic1" name="topic1">
            <label for="topic1">Artificial Intelligence</label><br>
            <input type="checkbox" id="topic2" name="topic2">
            <label for="topic2">Web Development</label><br>
            <input type="checkbox" id="topic3" name="topic3">
            <label for="topic3">Cyber Security</label><br>
            <input type="checkbox" id="topic4" name="topic4">
            <label for="topic4">Data Science</label><br><br>
            
            <input type="submit" value="Register">
        </form>
    </body>
</html>
