
 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Exploration</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f9ff;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 {
    color: #0a3d62;
    background: #dff9fb;
    padding: 15px;
    border-radius: 10px;
}

h2 {
    color: #130f40;
    margin-top: 30px;
}

iframe {
    border: 4px solid #0a3d62;
    border-radius: 12px;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    margin-top: 10px;
}

.container {
    background: white;
    padding: 20px;
    margin: 20px auto;
    width: 80%;
    border-radius: 15px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
}
</style>

</head>
<body>

<h1>Space Exploration</h1>

<div class="container">
    <h2>NASA Kennedy Space Center Location</h2>
    <iframe 
    src="https://www.google.com/maps?q=Kennedy+Space+Center+Florida&output=embed" 
    width="600" 
    height="400" 
    allowfullscreen="" 
    loading="lazy">
    </iframe>
</div>

<div class="container">
    <h2>Space Information</h2>
    <iframe 
    src="https://www.britannica.com/science/space-exploration" 
    width="600" 
    height="400">
    </iframe>
</div>

</body>
</html>
