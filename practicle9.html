<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web page</title>
    <!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;

}
body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f2f2f2;
}
header{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
header h1{
    color: #333;
    font-size: 24px;
}
nav a{
    color: #333;
    text-decoration: none;
    margin-left: 20px;
    font-size: 18px;
}
nav a:hover{
    color: #007bff;
}
.hero{
    text-align: center;
  padding: 50px 20px;
  animation: fadeIn 2s;
}
.hero h2{
     font-size: 2.5rem;
}
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
}
.card {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  padding: 20px;
  text-align: center;
}
card image {
    width: 100%;
    height: auto;
    border-radius: 8px;
}
.card:hover {
  transform: scale(1.05);
}
.card button {
  background: #38bdf8;
  border: none;
  padding: 10px;
  margin: 10px;
  cursor: pointer;
  border-radius: 5px;
}

.card button:hover {
  background: #0ea5e9;
}

/* REVIEWS */
.reviews {
  padding: 20px;
}

.review-box {
  background: #1e293b;
  margin: 10px 0;
  padding: 15px;
  border-radius: 10px;
}

/* FORM */
.form-section {
  padding: 20px;
  text-align: center;
}

input, textarea {
  width: 80%;
  padding: 10px;
  margin: 10px;
  border-radius: 5px;
  border: none;
}

button.submit {
  background: #22c55e;
  color: white;
  padding: 10px 20px;
  border: none;
  cursor: pointer;
}

/* ANIMATION */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* RESPONSIVE */
@media(max-width: 768px) {
  header {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎮 GameZone</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Games</a>
    <a href="#">Reviews</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h2>Welcome to GameZone 🔥</h2>
  <p>Play the best games with amazing experience</p>
</section>

<!-- GAME LIST -->
<section class="container">
  <div class="card">
    <img src="shadow fight.png" alt="Shadow Fight">
    <h3>Shadow Fight</h3>
    <p>⭐⭐⭐⭐☆</p>
    <button>Play Now</button>
  </div>

  <div class="card">
    <img src="speed racer.png" alt="Speed Racer">
    <h3>Speed Racer</h3>
    <p>⭐⭐⭐⭐⭐</p>
    <button>Play Now</button>
  </div>

  <div class="card">
    <img src="zombie war.png" alt="Zombie War">
    <h3>Zombie War</h3>
    <p>⭐⭐⭐☆☆</p>
    <button>Play Now</button>
  </div>
</section>





</body>
</html>
